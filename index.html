<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Niche CRM — Connexion</title>
  <!-- Police moderne & professionnelle -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue-accent: #2b2fff;
      --blue-glow: rgba(43, 47, 255, 0.4);
      --bg-dark: #07070b;
      --card-bg: rgba(18, 18, 24, 0.7);
      --border-light: rgba(255, 255, 255, 0.06);
      --text-main: #f0f0fc;
      --text-muted: #9f9fbb;
      --surface-hover: rgba(43, 47, 255, 0.12);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1.5rem;
    }

    /* Grille de points subtile */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* Blobs flous / ambiance néon */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    .blob-1 {
      width: 540px;
      height: 540px;
      background: #2b2fff;
      top: -180px;
      left: -140px;
      opacity: 0.18;
    }
    .blob-2 {
      width: 440px;
      height: 440px;
      background: #4a56ff;
      bottom: -120px;
      right: -80px;
      opacity: 0.12;
    }
    .blob-3 {
      width: 280px;
      height: 280px;
      background: #7b8aff;
      top: 45%;
      left: 65%;
      opacity: 0.1;
    }

    .container {
      position: relative;
      z-index: 12;
      width: 100%;
      max-width: 470px;
      margin: 0 auto;
    }

    /* CARTE PRINCIPALE */
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-light);
      border-radius: 2.5rem;
      padding: 2.2rem 2rem 2.2rem 2rem;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(43, 47, 255, 0.1);
      transition: transform 0.25s ease;
    }

    /* LOGO + BADGE "NICHE" (version exacte style original) */
    .logo-block {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .logo-svg {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }
    .brand-text h2 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #c5cbff 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 0.2rem;
    }

    /* RANGÉE D'ICÔNES DÉCORATIVES (exactement comme demandé : icônes stylées) */
    .icon-strip {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      background: rgba(43, 47, 255, 0.05);
      border-radius: 1.6rem;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(43, 47, 255, 0.15);
    }
    .icon-pill {
      background: rgba(43, 47, 255, 0.18);
      border-radius: 14px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(2px);
    }
    .icon-pill svg {
      width: 24px;
      height: 24px;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }
    .sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
      border-left: 2px solid var(--blue-accent);
      padding-left: 0.75rem;
    }

    .input-group {
      margin-bottom: 1.3rem;
    }
    .input-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .input-group input {
      width: 100%;
      background: rgba(10, 10, 16, 0.7);
      border: 1px solid var(--border-light);
      border-radius: 1rem;
      padding: 0.85rem 1rem;
      font-family: 'Inter', monospace;
      font-size: 0.95rem;
      color: white;
      transition: all 0.2s;
      outline: none;
    }
    .input-group input:focus {
      border-color: var(--blue-accent);
      box-shadow: 0 0 0 3px rgba(43, 47, 255, 0.2);
      background: rgba(18, 18, 28, 0.9);
    }
    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-weight: 400;
    }

    .role-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 1rem 0 0.7rem 0;
      display: block;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
      margin-bottom: 1.9rem;
    }
    .role-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-light);
      border-radius: 1.2rem;
      padding: 0.75rem 0.25rem;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .role-btn:hover {
      background: var(--surface-hover);
      border-color: rgba(43, 47, 255, 0.5);
      color: white;
    }
    .role-btn.active {
      background: rgba(43, 47, 255, 0.2);
      border-color: var(--blue-accent);
      color: white;
      box-shadow: 0 2px 8px rgba(43, 47, 255, 0.2);
    }

    .signin-btn {
      width: 100%;
      background: var(--blue-accent);
      border: none;
      border-radius: 1.6rem;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 18px rgba(43, 47, 255, 0.3);
      margin-top: 0.3rem;
    }
    .signin-btn:hover {
      background: #3f48ff;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(43, 47, 255, 0.35);
    }
    .signin-btn:active {
      transform: translateY(1px);
    }
    .arrow-icon {
      font-size: 1.2rem;
      transition: transform 0.2s;
    }
    .signin-btn:hover .arrow-icon {
      transform: translateX(5px);
    }

    .footer-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .footer-note a {
      color: #8d9bff;
      text-decoration: none;
      border-bottom: 1px dotted rgba(141, 155, 255, 0.4);
    }
    .footer-note a:hover {
      color: white;
    }

    /* Zone de navigation rapide vers tous les modules (pages) */
    .pages-quick {
      margin-top: 1.8rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(43, 47, 255, 0.2);
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      transition: 0.2s;
    }
    .pages-quick p {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .page-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .page-links a {
      background: rgba(43, 47, 255, 0.1);
      border: 1px solid rgba(43, 47, 255, 0.25);
      border-radius: 30px;
      padding: 0.35rem 0.85rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #b9c2ff;
      text-decoration: none;
      transition: all 0.15s;
    }
    .page-links a:hover {
      background: rgba(43, 47, 255, 0.3);
      color: white;
      border-color: #4f5bff;
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .login-card {
        padding: 1.6rem;
      }
      .roles-grid {
        gap: 0.5rem;
      }
      .icon-pill {
        width: 38px;
        height: 38px;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <div class="login-card">
      <!-- BLOC LOGO EXACT : Niche + symbole 'che' d'après la maquette originale -->
      <div class="logo-block">
        <svg class="logo-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- point bleu signature -->
          <circle cx="84" cy="24" r="13" fill="#2b2fff" />
          <!-- barre verticale fine -->
          <rect x="76" y="37" width="4" height="54" rx="2" fill="white" />
          <!-- texte "che" typographique -->
          <text x="78" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="white">che</text>
          <!-- forme originale lettre N (cercle + découpe) -->
          <ellipse cx="38" cy="68" rx="30" ry="42" fill="white" />
          <path d="M22 46 L22 96 L35 96 L35 64 L52 96 L55 96 L55 46 L42 46 L42 74 L28 46 Z" fill="#07070b" />
        </svg>
        <div class="brand-text">
          <h2>Niche</h2>
          <p>PLATEFORME CRM</p>
        </div>
      </div>

      <!-- LIGNE D'ICÔNES PROFESSIONNELLES (modernes + élégantes) exactement comme voulu : icônes réelles -->
      <div class="icon-strip">
        <!-- icône dossier -->
        <div class="icon-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M3 7C3 5.89543 3.89543 5 5 5H10L12 7H19C20.1046 7 21 7.89543 21 9V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7Z" fill="#2b2fff" fill-opacity="0.85" />
            <path d="M3 7C3 5.89543 3.89543 5 5 5H10L12 7H19C20.1046 7 21 7.89543 21 9V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7Z" fill="#8f9eff" fill-opacity="0.35" />
          </svg>
        </div>
        <!-- icône utilisateur/profil -->
        <div class="icon-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" fill="#2b2fff" fill-opacity="0.9" />
            <path d="M4 20C4 17 7.58 15 12 15C16.42 15 20 17 20 20" stroke="#8f9eff" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="18" cy="6" r="3" fill="#2b2fff" fill-opacity="0.7" />
          </svg>
        </div>
        <!-- icône calendrier -->
        <div class="icon-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="16" rx="3" fill="#8f9eff" fill-opacity="0.35" />
            <rect x="3" y="5" width="18" height="7" rx="3" fill="#2b2fff" fill-opacity="0.8" />
            <text x="9" y="17" font-size="7" font-weight="700" fill="white" font-family="sans-serif">31</text>
            <line x1="8" y1="3" x2="8" y2="7" stroke="white" stroke-width="1.8" stroke-linecap="round" />
            <line x1="16" y1="3" x2="16" y2="7" stroke="white" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </div>
        <!-- icône graphique / stats -->
        <div class="icon-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="14" width="4" height="7" rx="1.2" fill="#8f9eff" fill-opacity="0.6" />
            <rect x="10" y="9" width="4" height="12" rx="1.2" fill="#2b2fff" fill-opacity="0.85" />
            <rect x="17" y="5" width="4" height="16" rx="1.2" fill="#2b2fff" fill-opacity="0.45" />
          </svg>
        </div>
        <!-- icône cadenas / sécurité -->
        <div class="icon-pill">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="10" rx="3" fill="#8f9eff" fill-opacity="0.3" />
            <path d="M8 11V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V11" stroke="#2b2fff" stroke-width="2" stroke-linecap="round" />
            <circle cx="12" cy="16" r="1.5" fill="#2b2fff" fill-opacity="0.95" />
          </svg>
        </div>
      </div>

      <h1>Content de te revoir</h1>
      <div class="sub">Connectez-vous à votre espace de travail</div>

      <div class="input-group">
        <label>E-MAIL</label>
        <input type="email" id="loginEmail" placeholder="ilyaserroutfi@gmail.com" value="ilyaserroutfi@gmail.com" />
      </div>
      <div class="input-group">
        <label>MOT DE PASSE</label>
        <input type="password" id="loginPassword" placeholder="********" value="secretpass" />
      </div>

      <span class="role-label">SE CONNECTER EN TANT QUE</span>
      <div class="roles-grid" id="rolesContainer">
        <button class="role-btn active" data-role="admin">⚡ Admin</button>
        <button class="role-btn" data-role="chef-projet">🎯 Chef de projet</button>
        <button class="role-btn" data-role="freelancer">💼 Freelancer</button>
        <button class="role-btn" data-role="client">👤 Client</button>
      </div>

      <button class="signin-btn" id="signinBtn">SE CONNECTER <span class="arrow-icon">→</span></button>
      <div class="footer-note">
        Besoin d'accès ? <a href="#">Contacter votre administrateur</a>
      </div>
    </div>

    <!-- RACCOURCI VERS TOUTES LES PAGES / MODULES (dashboard, leads, freelancers, clients, etc) -->
    <div class="pages-quick">
      <p>📁 Modules & pages principales</p>
      <div class="page-links" id="pageLinks">
        <!-- ces liens seront fonctionnels une fois les fichiers .html créés, mais on les garde pour la navigation future -->
        <a href="pages/dashboard.html">Dashboard</a>
        <a href="pages/leads.html">Leads</a>
        <a href="pages/cold-callers.html">Cold Callers</a>
        <a href="pages/outreachers.html">Outreachers</a>
        <a href="pages/freelancers.html">Freelancers</a>
        <a href="pages/clients.html">Clients</a>
        <a href="pages/tasks.html">Tâches</a>
        <a href="pages/finance.html">Finance</a>
        <a href="pages/analytics.html">Analytics</a>
      </div>
    </div>
  </div>

  <script>
    // Gestion des rôles actifs
    const roleBtns = document.querySelectorAll('.role-btn');
    let currentRole = 'admin';   // par défaut admin

    function setActiveRole(selectedBtn) {
      roleBtns.forEach(btn => btn.classList.remove('active'));
      selectedBtn.classList.add('active');
      currentRole = selectedBtn.getAttribute('data-role');
    }

    roleBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        setActiveRole(btn);
      });
    });

    // Fonction de redirection dynamique selon le rôle choisi
    function handleLogin() {
      const emailInput = document.getElementById('loginEmail').value.trim();
      const pwdInput = document.getElementById('loginPassword').value.trim();

      // petite vérification non-bloquante mais conviviale : 
      if (!emailInput || !pwdInput) {
        alert("Veuillez saisir votre email et mot de passe pour accéder à l'espace.");
        return;
      }

      // Simuler la redirection : pour le client => clients.html, pour les autres => dashboard.html
      // (Les pages seront construites ultérieurement, mais on effectue la redirection vers les vrais dossiers)
      if (currentRole === 'client') {
        // Redirection vers la page clients
        window.location.href = 'pages/clients.html';
      } else {
        // Admin, chef de projet, freelancer → dashboard général
        window.location.href = 'pages/dashboard.html';
      }
    }

    const signBtn = document.getElementById('signinBtn');
    signBtn.addEventListener('click', handleLogin);

    // permettre "Enter" dans les champs
    const emailField = document.getElementById('loginEmail');
    const passwordField = document.getElementById('loginPassword');
    const handleKeyPress = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
      }
    };
    emailField.addEventListener('keypress', handleKeyPress);
    passwordField.addEventListener('keypress', handleKeyPress);

    // Petite initialisation: préremplir l'email (comme sur la maquette)
    // (déjà pré-rempli dans le HTML)
  </script>
</body>
</html>
