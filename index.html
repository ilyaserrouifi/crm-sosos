<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Niche CRM — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#2b2fff;
  --blue2:#4f5aff;
  --glow:rgba(43,47,255,0.38);
  --bg:#0b0b0e;
  --card:rgba(255,255,255,0.032);
  --border:rgba(255,255,255,0.07);
  --text:#ededf2;
  --muted:rgba(237,237,242,0.38);
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
}
/* dot grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(rgba(255,255,255,0.045) 1px,transparent 1px);
  background-size:30px 30px;pointer-events:none;z-index:0;
}
/* blobs */
.blob{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
.b1{width:520px;height:520px;background:rgba(43,47,255,0.13);top:-140px;left:-140px;}
.b2{width:380px;height:380px;background:rgba(43,47,255,0.08);bottom:-80px;right:-80px;}
.b3{width:220px;height:220px;background:rgba(80,100,255,0.07);top:50%;left:55%;}

.wrap{
  position:relative;z-index:10;
  width:100%;max-width:440px;
  padding:0 16px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:48px 40px 44px;
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  box-shadow:0 0 90px rgba(43,47,255,0.07),0 48px 96px rgba(0,0,0,0.55);
  animation:fadeup .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}

/* ── LOGO ── */
.logo{display:flex;align-items:center;gap:16px;margin-bottom:44px;}
.logo-img{width:64px;height:64px;flex-shrink:0;}
.logo-text .n{font-size:19px;font-weight:600;color:#fff;letter-spacing:-.3px;}
.logo-text .s{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:2px;}

/* ── ICON SET preview (decorative, shows the style) ── */
.icon-row{
  display:flex;gap:10px;margin-bottom:36px;
  padding:12px 14px;
  background:rgba(43,47,255,0.06);
  border:1px solid rgba(43,47,255,0.12);
  border-radius:12px;
}
.icon-pill{
  width:36px;height:36px;border-radius:9px;
  background:rgba(43,47,255,0.18);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

h1{font-size:27px;font-weight:600;letter-spacing:-.6px;margin-bottom:5px;}
.tagline{color:var(--muted);font-size:13.5px;margin-bottom:32px;}

.field{margin-bottom:15px;}
label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:7px;letter-spacing:.5px;text-transform:uppercase;}
input{
  width:100%;
  background:rgba(255,255,255,0.042);
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px 15px;
  color:var(--text);
  font-size:14px;
  font-family:'DM Sans',sans-serif;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:rgba(255,255,255,0.17);}
input:focus{border-color:rgba(43,47,255,.55);box-shadow:0 0 0 3px rgba(43,47,255,.1);}

.role-label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;display:block;}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:28px;}
.role{
  padding:10px 8px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--muted);
  font-size:12.5px;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:all .17s;text-align:center;
}
.role:hover{border-color:rgba(43,47,255,.4);color:var(--text);}
.role.on{background:rgba(43,47,255,.15);border-color:var(--blue);color:#fff;}

.btn{
  width:100%;padding:13.5px;
  background:var(--blue);border:none;border-radius:11px;
  color:#fff;font-size:14.5px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  transition:all .2s;
  box-shadow:0 0 30px var(--glow);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{background:var(--blue2);box-shadow:0 0 44px var(--glow);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.arrow{font-size:18px;transition:transform .2s;}
.btn:hover .arrow{transform:translateX(4px);}

.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:20px;}
.footer a{color:rgba(120,130,255,.85);text-decoration:none;}
.footer a:hover{color:#fff;}

/* pages skeleton links (hidden — just to pre-load) */
.pages-preview{
  margin-top:28px;
  padding:16px;
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:14px;
}
.pages-preview p{font-size:11px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.page-links{display:flex;flex-wrap:wrap;gap:6px;}
.page-links a{
  font-size:11px;padding:5px 10px;
  background:rgba(43,47,255,.1);
  border:1px solid rgba(43,47,255,.2);
  border-radius:6px;color:rgba(120,130,255,.9);
  text-decoration:none;transition:all .15s;
}
.page-links a:hover{background:rgba(43,47,255,.2);color:#fff;}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="wrap">
<div class="card">

  <!-- REAL NICHE LOGO -->
  <div class="logo">
    <svg class="logo-img" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- blue dot -->
      <circle cx="82" cy="22" r="12" fill="#2b2fff"/>
      <!-- vertical bar -->
      <rect x="74" y="34" width="4" height="56" rx="2" fill="white"/>
      <!-- "che" lowercase -->
      <text x="80" y="90" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="white">che</text>
      <!-- N letterform inside oval -->
      <ellipse cx="36" cy="66" rx="28" ry="40" fill="white"/>
      <!-- N cutout -->
      <path d="M22 42 L22 90 L33 90 L33 62 L48 90 L52 90 L52 42 L41 42 L41 68 L27 42 Z" fill="#0b0b0e"/>
    </svg>
    <div class="logo-text">
      <div class="n">Niche</div>
      <div class="s">CRM Platform</div>
    </div>
  </div>

  <!-- Icon style preview -->
  <div class="icon-row">
    <!-- folder -->
    <div class="icon-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M3 7C3 5.9 3.9 5 5 5H10L12 7H19C20.1 7 21 7.9 21 9V17C21 18.1 20.1 19 19 19H5C3.9 19 3 18.1 3 17V7Z" fill="rgba(43,47,255,0.9)" opacity=".85"/>
        <path d="M3 7C3 5.9 3.9 5 5 5H10L12 7H19C20.1 7 21 7.9 21 9V17C21 18.1 20.1 19 19 19H5C3.9 19 3 18.1 3 17V7Z" fill="rgba(130,150,255,0.3)"/>
      </svg>
    </div>
    <!-- user -->
    <div class="icon-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" fill="rgba(43,47,255,0.9)"/>
        <path d="M4 20C4 17 7.58 15 12 15C16.42 15 20 17 20 20" stroke="rgba(130,150,255,0.7)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="18" cy="6" r="3" fill="#2b2fff"/>
      </svg>
    </div>
    <!-- calendar -->
    <div class="icon-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="5" width="18" height="16" rx="3" fill="rgba(130,150,255,0.3)"/>
        <rect x="3" y="5" width="18" height="7" rx="3" fill="rgba(43,47,255,0.85)"/>
        <text x="8" y="17" font-size="7" font-weight="700" fill="rgba(43,47,255,0.9)" font-family="sans-serif">31</text>
        <line x1="8" y1="3" x2="8" y2="7" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="3" x2="16" y2="7" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <!-- chart -->
    <div class="icon-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="14" width="4" height="7" rx="1.5" fill="rgba(130,150,255,0.5)"/>
        <rect x="10" y="9" width="4" height="12" rx="1.5" fill="rgba(43,47,255,0.85)"/>
        <rect x="17" y="5" width="4" height="16" rx="1.5" fill="rgba(43,47,255,0.6)"/>
      </svg>
    </div>
    <!-- lock -->
    <div class="icon-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="5" y="11" width="14" height="10" rx="3" fill="rgba(130,150,255,0.35)"/>
        <path d="M8 11V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V11" stroke="rgba(43,47,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1.5" fill="rgba(43,47,255,0.9)"/>
      </svg>
    </div>
  </div>

  <h1>Welcome back</h1>
  <p class="tagline">Sign in to your workspace</p>

  <div class="field">
    <label>Email</label>
    <input type="email" id="em" placeholder="you@niche.com"/>
  </div>
  <div class="field" style="margin-bottom:22px;">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••"/>
  </div>

  <span class="role-label">Login as</span>
  <div class="roles">
    <button class="role on" onclick="pick(this)">⚡ Admin</button>
    <button class="role" onclick="pick(this)">🎯 Project Manager</button>
    <button class="role" onclick="pick(this)">💼 Freelancer</button>
    <button class="role" onclick="pick(this)">👤 Client</button>
  </div>

  <button class="btn" onclick="go()">Sign in <span class="arrow">→</span></button>
  <p class="footer">Need access? <a href="#">Contact your admin</a></p>
</div>

<!-- Quick nav to all pages (dev helper) -->
<div class="pages-preview">
  <p>All pages</p>
  <div class="page-links">
    <a href="pages/dashboard.html">Dashboard</a>
    <a href="pages/leads.html">Leads</a>
    <a href="pages/cold-callers.html">Cold Callers</a>
    <a href="pages/outreachers.html">Outreachers</a>
    <a href="pages/freelancers.html">Freelancers</a>
    <a href="pages/clients.html">Clients</a>
    <a href="pages/tasks.html">Tasks</a>
    <a href="pages/finance.html">Finance</a>
    <a href="pages/analytics.html">Analytics</a>
  </div>
</div>

</div><!-- /wrap -->

<script>
function pick(el){
  document.querySelectorAll('.role').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
function go(){
  const role=document.querySelector('.role.on').textContent.trim().toLowerCase();
  if(role.includes('client')) location.href='pages/clients.html';
  else location.href='pages/dashboard.html';
}
</script>
</body>
</html>
