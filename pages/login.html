<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول — CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e8e8f0; font-family: 'IBM Plex Sans Arabic', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(#2a2a3a 1px, transparent 1px), linear-gradient(90deg, #2a2a3a 1px, transparent 1px); background-size: 40px 40px; opacity: 0.2; pointer-events: none; }
    .card { background: #12121a; border: 1px solid #2a2a3a; border-radius: 20px; padding: 48px 40px; width: 360px; position: relative; z-index: 1; }
    .logo { width: 56px; height: 56px; border: 2px solid #6c63ff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #6c63ff; margin: 0 auto 24px; box-shadow: 0 0 30px rgba(108,99,255,0.3); }
    h1 { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .sub { text-align: center; color: #6b6b80; font-size: 13px; margin-bottom: 36px; }
    label { display: block; font-size: 13px; color: #9898aa; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 16px; background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 10px; color: #e8e8f0; font-size: 14px; font-family: inherit; margin-bottom: 20px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #6c63ff; }
    button { width: 100%; padding: 13px; background: #6c63ff; color: white; border: none; border-radius: 10px; font-size: 15px; font-family: inherit; font-weight: 500; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .error { color: #ff6584; font-size: 13px; text-align: center; margin-top: 14px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">◆</div>
    <h1>CRM NiChe</h1>
    <p class="sub">سجل دخولك للمتابعة</p>
    <label>الاسم</label>
    <input type="text" id="username" placeholder="أدخل اسمك">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">دخول ←</button>
    <p class="error" id="err">⚠️ أدخل الاسم وكلمة المرور</p>
  </div>
  <script>
    function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) { document.getElementById('err').style.display = 'block'; return; }
      localStorage.setItem('crm_user', u);
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
