<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e8e8f0; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #12121a; border-left: 1px solid #2a2a3a; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; position: fixed; top: 0; bottom: 0; }
    .logo { font-size: 18px; font-weight: 600; color: #6c63ff; padding: 8px 12px 24px; }
    .nav-item { padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; color: #9898aa; transition: all 0.2s; }
    .nav-item:hover { background: #1a1a26; color: #e8e8f0; }
    .nav-item.active { background: #1e1b3a; color: #6c63ff; }
    .logout { margin-top: auto; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; color: #ff6584; }
    .logout:hover { background: #2a1a1a; }
    .main { margin-right: 220px; padding: 32px; flex: 1; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .topbar h1 { font-size: 22px; font-weight: 600; }
    .btn { background: #6c63ff; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-family: inherit; cursor: pointer; }
    .btn:hover { opacity: 0.85; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .col { background: #12121a; border: 1px solid #2a2a3a; border-radius: 16px; padding: 20px; }
    .col-title { font-size: 14px; font-weight: 500; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #2a2a3a; }
    .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1a1a26; }
    .task-item:last-child { border-bottom: none; }
    .checkbox { width: 18px; height: 18px; border: 2px solid #2a2a3a; border-radius: 5px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all 0.2s; }
    .checkbox.done { background: #4ecca3; border-color: #4ecca3; }
    .task-text { flex: 1; font-size: 14px; line-height: 1.5; }
    .task-text.done { text-decoration: line-through; color: #6b6b80; }
    .task-date { font-size: 11px; color: #6b6b80; margin-top: 3px; }
    .del-btn { background: none; border: none; color: #ff6584; cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; }
    .empty { text-align: center; color: #6b6b80; padding: 30px 0; font-size: 13px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-bg.open { display: flex; }
    .modal { background: #12121a; border: 1px solid #2a2a3a; border-radius: 20px; padding: 32px; width: 400px; }
    .modal h2 { margin-bottom: 24px; font-size: 18px; }
    label { display: block; font-size: 13px; color: #9898aa; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 11px 14px; background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 10px; color: #e8e8f0; font-size: 14px; font-family: inherit; margin-bottom: 16px; outline: none; resize: none; }
    input:focus, textarea:focus { border-color: #6c63ff; }
    .modal-btns { display: flex; gap: 10px; }
    .btn-cancel { flex: 1; background: #1a1a26; color: #9898aa; border: 1px solid #2a2a3a; padding: 11px; border-radius: 10px; font-size: 14px; font-family: inherit; cursor: pointer; }
    .stats { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat { background: #12121a; border: 1px solid #2a2a3a; border-radius: 12px; padding: 16px 20px; flex: 1; text-align: center; }
    .stat .n { font-size: 24px; font-weight: 600; }
    .stat .l { font-size: 12px; color: #6b6b80; margin-top: 4px; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">◆ CRM NiChe</div>
    <div class="nav-item" onclick="location.href='dashboard.html'">📊 Dashboard</div>
    <div class="nav-item" onclick="location.href='clients.html'">👥 Clients</div>
    <div class="nav-item" onclick="location.href='leads.html'">🎯 Leads</div>
    <div class="nav-item active">✅ Tasks</div>
    <div class="logout" onclick="logout()">🚪 خروج</div>
  </nav>
  <main class="main">
    <div class="topbar">
      <h1>✅ المهام</h1>
      <button class="btn" onclick="openModal()">+ إضافة مهمة</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">إجمالي</div></div>
      <div class="stat"><div class="n" id="s-pending" style="color:#f6a623">0</div><div class="l">معلقة</div></div>
      <div class="stat"><div class="n" id="s-done" style="color:#4ecca3">0</div><div class="l">منجزة</div></div>
    </div>
    <div class="cols">
      <div class="col">
        <div class="col-title">🟡 المهام المعلقة</div>
        <div id="pending-list"></div>
      </div>
      <div class="col">
        <div class="col-title">✅ المهام المنجزة</div>
        <div id="done-list"></div>
      </div>
    </div>
  </main>
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2>إضافة مهمة جديدة</h2>
      <label>عنوان المهمة</label>
      <input type="text" id="f-title" placeholder="مثال: التواصل مع العميل X">
      <label>ملاحظات (اختياري)</label>
      <textarea id="f-note" rows="3" placeholder="تفاصيل إضافية..."></textarea>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
        <button class="btn" style="flex:2" onclick="addTask()">حفظ</button>
      </div>
    </div>
  </div>
  <script>
    if (!localStorage.getItem('crm_user')) window.location.href = '../index.html';
    function getTasks() { return JSON.parse(localStorage.getItem('crm_tasks') || '[]'); }
    function saveTasks(d) { localStorage.setItem('crm_tasks', JSON.stringify(d)); }
    function render() {
      const tasks = getTasks();
      const pending = tasks.filter(t => !t.done);
      const done = tasks.filter(t => t.done);
      document.getElementById('s-total').textContent = tasks.length;
      document.getElementById('s-pending').textContent = pending.length;
      document.getElementById('s-done').textContent = done.length;
      const pEl = document.getElementById('pending-list');
      const dEl = document.getElementById('done-list');
      pEl.innerHTML = pending.length ? pending.map(t => taskHTML(t, tasks.indexOf(t))).join('') : '<p class="empty">لا توجد مهام معلقة 🎉</p>';
      dEl.innerHTML = done.length ? done.map(t => taskHTML(t, tasks.indexOf(t))).join('') : '<p class="empty">لا توجد مهام منجزة بعد</p>';
    }
    function taskHTML(t, i) {
      return '<div class="task-item"><div class="checkbox ' + (t.done?'done':'') + '" onclick="toggle(' + i + ')">' + (t.done?'✓':'') + '</div><div style="flex:1"><div class="task-text ' + (t.done?'done':'') + '">' + t.title + '</div>' + (t.note?'<div class="task-date">' + t.note + '</div>':'') + '<div class="task-date">' + (t.date||'') + '</div></div><button class="del-btn" onclick="del(' + i + ')">✕</button></div>';
    }
    function toggle(i) { const d = getTasks(); d[i].done = !d[i].done; saveTasks(d); render(); }
    function del(i) { const d = getTasks(); d.splice(i,1); saveTasks(d); render(); }
    function openModal() { document.getElementById('modal').classList.add('open'); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    function addTask() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) return;
      const tasks = getTasks();
      tasks.push({ title, note: document.getElementById('f-note').value.trim(), done: false, date: new Date().toLocaleDateString('ar-MA') });
      saveTasks(tasks); closeModal(); render();
      document.getElementById('f-title').value = ''; document.getElementById('f-note').value = '';
    }
    function logout() { localStorage.removeItem('crm_user'); window.location.href = '../index.html'; }
    render();
  </script>
</body>
</html>
