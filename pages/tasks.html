<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — CRM NiChe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060c14;--surface:#080f1a;--surface2:#0d1628;--blue:#1a6bff;--text:#e0eaff;--muted:#4a6080;--border:#0e2040;--green:#00d4aa;--red:#ff4d6d;--amber:#ffaa00}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;min-height:100vh;font-size:14px}
    .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0}
    .logo{font-size:17px;font-weight:600;color:var(--blue);padding:8px 12px 20px}
    .nav-section{font-size:10px;color:var(--muted);padding:12px 12px 6px;letter-spacing:1px;text-transform:uppercase}
    .nav-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:9px}
    .nav-item:hover{background:var(--surface2);color:var(--text)}
    .nav-item.active{background:rgba(26,107,255,.15);color:var(--blue)}
    .logout{margin-top:auto;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--red);display:flex;align-items:center;gap:9px}
    .logout:hover{background:rgba(255,77,109,.1)}
    .main{margin-left:220px;padding:28px;flex:1}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
    .topbar h1{font-size:20px;font-weight:600}
    .btn{background:var(--blue);color:white;border:none;padding:9px 18px;border-radius:9px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}
    .btn:hover{opacity:.88}
    .stats{display:flex;gap:14px;margin-bottom:22px}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;flex:1;text-align:center}
    .stat .n{font-size:24px;font-weight:600}
    .stat .l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .col{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
    .col-title{font-size:12px;font-weight:500;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
    .task-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
    .task-item:last-child{border-bottom:none}
    .checkbox{width:17px;height:17px;border:2px solid var(--border);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .2s;font-size:10px}
    .checkbox.done{background:var(--green);border-color:var(--green);color:#060c14}
    .task-text{flex:1;font-size:13px;line-height:1.5}
    .task-text.done{text-decoration:line-through;color:var(--muted)}
    .task-note{font-size:11px;color:var(--muted);margin-top:3px}
    .del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:5px}
    .del-btn:hover{background:rgba(255,77,109,.1)}
    .empty{text-align:center;color:var(--muted);padding:28px 0;font-size:13px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100}
    .modal-bg.open{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;width:400px}
    .modal h2{margin-bottom:22px;font-size:17px}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
    input,textarea{width:100%;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;font-family:inherit;margin-bottom:14px;outline:none;resize:none}
    input:focus,textarea:focus{border-color:var(--blue)}
    .modal-btns{display:flex;gap:10px}
    .btn-cancel{flex:1;background:var(--surface2);color:var(--muted);border:1px solid var(--border);padding:10px;border-radius:9px;font-size:13px;font-family:inherit;cursor:pointer}
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">◆ CRM NiChe</div>
    <div class="nav-section">Main</div>
    <div class="nav-item" onclick="location.href='dashboard.html'"><span>▣</span> Dashboard</div>
    <div class="nav-item" onclick="location.href='clients.html'"><span>👥</span> Clients</div>
    <div class="nav-item" onclick="location.href='leads.html'"><span>🎯</span> Leads</div>
    <div class="nav-item active"><span>✅</span> Tasks</div>
    <div class="logout" onclick="logout()"><span>⬡</span> Logout</div>
  </nav>
  <main class="main">
    <div class="topbar">
      <h1>Tasks</h1>
      <button class="btn" onclick="openModal()">+ Add Task</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">Total</div></div>
      <div class="stat"><div class="n" id="s-pending" style="color:var(--amber)">0</div><div class="l">Pending</div></div>
      <div class="stat"><div class="n" id="s-done" style="color:var(--green)">0</div><div class="l">Done</div></div>
    </div>
    <div class="cols">
      <div class="col"><div class="col-title">Pending</div><div id="pending-list"></div></div>
      <div class="col"><div class="col-title">Completed</div><div id="done-list"></div></div>
    </div>
  </main>
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2>Add New Task</h2>
      <label>Task Title</label>
      <input type="text" id="f-title" placeholder="e.g. Follow up with client X">
      <label>Notes (optional)</label>
      <textarea id="f-note" rows="3" placeholder="Additional details..."></textarea>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn" style="flex:2" onclick="add()">Save</button>
      </div>
    </div>
  </div>
  <script>
    if(!localStorage.getItem('crm_user'))window.location.href='../index.html';
    function get(){return JSON.parse(localStorage.getItem('crm_tasks')||'[]')}
    function save(d){localStorage.setItem('crm_tasks',JSON.stringify(d))}
    function render(){
      const tasks=get();
      const pending=tasks.filter(t=>!t.done);
      const done=tasks.filter(t=>t.done);
      document.getElementById('s-total').textContent=tasks.length;
      document.getElementById('s-pending').textContent=pending.length;
      document.getElementById('s-done').textContent=done.length;
      document.getElementById('pending-list').innerHTML=pending.length?pending.map(t=>tHTML(t,tasks.indexOf(t))).join(''):'<p class="empty">No pending tasks 🎉</p>';
      document.getElementById('done-list').innerHTML=done.length?done.map(t=>tHTML(t,tasks.indexOf(t))).join(''):'<p class="empty">No completed tasks yet</p>';
    }
    function tHTML(t,i){return '<div class="task-item"><div class="checkbox '+(t.done?'done':'')+'" onclick="toggle('+i+')">'+(t.done?'✓':'')+'</div><div style="flex:1"><div class="task-text '+(t.done?'done':'')+'" >'+t.title+'</div>'+(t.note?'<div class="task-note">'+t.note+'</div>':'')+'</div><button class="del-btn" onclick="del('+i+')">✕</button></div>'}
    function toggle(i){const d=get();d[i].done=!d[i].done;save(d);render()}
    function del(i){const d=get();d.splice(i,1);save(d);render()}
    function openModal(){document.getElementById('modal').classList.add('open')}
    function closeModal(){document.getElementById('modal').classList.remove('open')}
    function add(){
      const title=document.getElementById('f-title').value.trim();
      if(!title)return;
      const d=get();
      d.push({title,note:document.getElementById('f-note').value.trim(),done:false,date:new Date().toLocaleDateString('en-GB')});
      save(d);closeModal();render();
      document.getElementById('f-title').value='';document.getElementById('f-note').value='';
    }
    function logout(){localStorage.removeItem('crm_user');window.location.href='../index.html'}
    render();
  </script>
</body>
</html>
